[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-elite-framework"
version = "1.0.0"
description = "Framework local para planejar, revisar e auditar projetos complexos com skills especializadas."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Matheus Florindo" }]
keywords = ["orchestration", "skills", "quality-assurance", "project-planning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
aef = "aef.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aef"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

